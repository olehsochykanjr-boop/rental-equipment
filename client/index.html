<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прокат обладнання</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Прокат обладнання</h1>
    <div id="authBar"></div>
  </header>

  <nav id="tabs" hidden>
    <button class="tab active" data-view="catalog">Каталог</button>
    <button class="tab" data-view="rentals" id="rentalsTab">Мої заявки</button>
  </nav>

  <main>
    <!-- Вигляд 1: каталог -->
    <section id="catalogView">
      <div class="filters">
        <label>Категорія
          <select id="categoryFilter">
            <option value="">Усі</option>
            <option value="laptop">Ноутбуки</option>
            <option value="camera">Камери</option>
            <option value="sensor">Датчики</option>
            <option value="other">Інше</option>
          </select>
        </label>
        <label>Статус
          <select id="statusFilter">
            <option value="">Будь-який</option>
            <option value="available">Вільна</option>
            <option value="rented">Видана</option>
            <option value="maintenance">У ремонті</option>
          </select>
        </label>
      </div>
      <p id="message"></p>
      <div id="equipmentList" class="grid"></div>
    </section>

    <!-- Вигляд 2: заявки -->
    <section id="rentalsView" hidden>
      <div class="filters" id="rentalFilterBar" hidden>
        <label>Статус заявки
          <select id="rentalStatusFilter">
            <option value="">Усі</option>
            <option value="pending">Очікують</option>
            <option value="approved">Підтверджені</option>
            <option value="rejected">Відхилені</option>
            <option value="cancelled">Скасовані</option>
            <option value="returned">Повернені</option>
          </select>
        </label>
      </div>
      <p id="rentalsMessage"></p>
      <div id="rentalsList" class="rental-list"></div>
    </section>
  </main>

  <!-- Вхід / реєстрація -->
  <dialog id="authDialog">
    <form id="authForm">
      <h2 id="authTitle">Вхід</h2>
      <label id="nameLabel" hidden>Ім'я
        <input id="nameInput" type="text" placeholder="Іван Петренко" autocomplete="name">
      </label>
      <label>Email
        <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label>Пароль
        <input id="passwordInput" type="password" placeholder="Мінімум 5 символів" autocomplete="current-password" required minlength="5">
      </label>
      <p id="authError" class="error"></p>
      <div class="actions">
        <button type="submit" id="authSubmit">Увійти</button>
        <button type="button" id="authCancel" class="secondary">Скасувати</button>
      </div>
      <p><a href="#" id="authToggle">Немає акаунта? Зареєструватися</a></p>
    </form>
  </dialog>

  <!-- Нова заявка -->
  <dialog id="rentalDialog">
    <form id="rentalForm">
      <h2>Заявка на техніку</h2>
      <p id="rentalEquipmentName"></p>
      <label>Дата повернення
        <input id="dueDateInput" type="date" required>
      </label>
      <label>Примітка
        <input id="notesInput" type="text" maxlength="200">
      </label>
      <p id="rentalError" class="error"></p>
      <div class="actions">
        <button type="submit">Надіслати</button>
        <button type="button" id="rentalCancel" class="secondary">Скасувати</button>
      </div>
    </form>
  </dialog>

  <!-- Редагування заявки -->
  <dialog id="editDialog">
    <form id="editForm">
      <h2>Змінити заявку</h2>
      <label>Дата повернення
        <input id="editDueDate" type="date" required>
      </label>
      <label>Примітка
        <input id="editNotes" type="text" maxlength="200">
      </label>
      <p id="editError" class="error"></p>
      <div class="actions">
        <button type="submit">Зберегти</button>
        <button type="button" id="editCancel" class="secondary">Скасувати</button>
      </div>
    </form>
  </dialog>

  <!-- Відхилення заявки (адмін) -->
  <dialog id="rejectDialog">
    <form id="rejectForm">
      <h2>Відхилити заявку</h2>
      <label>Причина
        <input id="rejectReason" type="text" maxlength="200" required placeholder="Наприклад: техніка потрібна для заняття">
      </label>
      <p id="rejectError" class="error"></p>
      <div class="actions">
        <button type="submit" class="danger">Відхилити</button>
        <button type="button" id="rejectCancel" class="secondary">Скасувати</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
