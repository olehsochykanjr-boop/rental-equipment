<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прокат обладнання</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Прокат обладнання</h1>
  </header>

  <main>
    <section class="filters">
      <label>Категорія
        <select id="categoryFilter">
          <option value="">Усі</option>
          <option value="laptop">Ноутбуки</option>
          <option value="camera">Камери</option>
          <option value="sensor">Датчики</option>
          <option value="other">Інше</option>
        </select>
      </label>
      <label>Статус
        <select id="statusFilter">
          <option value="">Будь-який</option>
          <option value="available">Вільна</option>
          <option value="rented">Видана</option>
          <option value="maintenance">У ремонті</option>
        </select>
      </label>
    </section>

    <p id="message"></p>
    <section id="equipmentList" class="grid"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
